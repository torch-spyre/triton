name: Report a Spyre lowering gap
description: Report a Triton pattern that does not lower, or lowers to surprising IR, in the Spyre backend
labels: ["lowering-gap"]

body:
- type: markdown
  attributes:
    value: |
      The best way to report a lowering gap is a pull request adding a lit test
      that pins the unsupported IR. The test should run today by asserting the
      current gap, and have a clear flip path when the lowering lands.

      If the pass **rejects** the input with a diagnostic, add a case to the
      matching `*-invalid.mlir` under `third_party/spyre/test/Conversion/` and
      pin the message:

      ```mlir
      // RUN: spyre-triton-opt %s --lower-compute-ops -split-input-file -verify-diagnostics

      tt.func @k(%arg0: tensor<4xf32>) {
        // expected-error @below {{no lowering for tt.foo}}
        %0 = tt.foo %arg0 : tensor<4xf32> -> tensor<4xf32>
        tt.return
      }
      ```

      If the pass **succeeds but leaves the op behind**, pin that instead with
      FileCheck — the op surviving is itself the gap:

      ```mlir
      // RUN: spyre-triton-opt %s --lower-compute-ops | FileCheck %s

      // CHECK-LABEL: @k
      // CHECK: tt.foo
      tt.func @k(%arg0: tensor<4xf32>) {
        %0 = tt.foo %arg0 : tensor<4xf32> -> tensor<4xf32>
        tt.return
      }
      ```

      In both cases explain in a comment why the case is expected to fail today
      and what should change when the lowering lands. Run
      `uv run lit build/cmake.*/third_party/spyre/test -v` before opening the PR.
      Use this issue template if you cannot construct the test yet and need
      maintainer help.
- type: textarea
  attributes:
    label: Triton pattern or IR that exposed the gap
    description: Include the Triton-language fragment, kernel, TTIR, or KTIR snippet that surprised you.
    placeholder: |
      ```python
      x = tl.foo(y)   # expected this to lower, but it does not
      ```
  validations:
    required: true
- type: dropdown
  attributes:
    label: Suspected pass
    description: Pick the pass you believe should handle this, or choose unknown if a maintainer should route it.
    options:
      - LowerComputeOps
      - LowerDescriptorMemory
      - LowerScalarLoad
      - RewriteDescriptorLayout
      - ConvertFunctions
      - DistributeWork
      - end-to-end kernel example (fixtures)
      - unknown
  validations:
    required: true
- type: input
  attributes:
    label: Linked test PR
    description: If you opened a PR adding a test that pins this gap, link it here.
    placeholder: "#NNN"
  validations:
    required: false
- type: textarea
  attributes:
    label: Generated output
    description: Paste the relevant TTIR, KTIR, logs, or test output.
    placeholder: |
      ```
      Relevant generated output
      ```
  validations:
    required: false
- type: textarea
  attributes:
    label: Environment
    description: Include the details needed to reproduce the issue.
    placeholder: |
      OS:
      Python:
      Repository commit:
      Install command:
      TRITON_BACKENDS:
      Submodules initialized: yes/no
  validations:
    required: true
